features:
  - id: "dpli_temmporal_target"
    name: "EventWindowedPairFeature"
    dataset: "novelty"
    preprocessors: ["selectsession","selecttime","zscore_norm"]
    args:
      feature_name: "DPLI_base"
      window_size: 400
      event_type: 2
      channel_pairs: [[2,3]]
      paradigm: "per_epoch"
      overlap: 0.5
      feature_args:
        sfreq: 2000
        x_lowcut: 5
        x_highcut: 10
        y_lowcut: 5
        y_highcut: 10   
  - id: "dpli_temmporal_standard"
    name: "EventWindowedPairFeature"
    dataset: "novelty"
    preprocessors: ["selectsession","selecttime","zscore_norm"]
    args:
      feature_name: "DPLI_base"
      window_size: 400
      event_type: 1
      channel_pairs: [[2,3]]
      paradigm: "per_epoch"
      overlap: 0.5
      feature_args:
        sfreq: 2000
        x_lowcut: 5
        x_highcut: 10
        y_lowcut: 5
        y_highcut: 10 


visualizers:
  - name: "box_comparison_visualizer"
    args:
      title: "Group comparison"
      labels: ["Target", "Standard"]
      ylabel: "Complexity"
      alpha: 0.05
      show_points: true
      jitter: 0.06
      reducer:
        select:
          - axis: 2   # choose the first channel pair
            indices: [10]
        aggregate: 1  # average over epochs
        flatten: false
      stat_test:
        paired: true
        nan_policy: "raise"
       
    inputs:
      - feature: "dpli_temmporal_target"
      - feature: "dpli_temmporal_standard"

storages: []

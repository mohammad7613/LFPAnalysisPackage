datasets:
  - id: "novelty"
    format: "mat_events"
    path: "/media/mohammad/atp/D/ComplexityCheckCodes/RawData/PiplineCodes/EpochedData/Fix_Ch_Order_PreConfig_1_epoched_preprocessed_novelty0-raw_dataV3.mat"
  - id: "complexity_rest"
    format: "mat_cell"
    path: "/media/mohammad/atp/D/ComplexityCheckCodes/RawData/PiplineCodes/Complexity/complexitySampeEnStandardizeChBaselineSessions.mat"

preprocessors:
  - id: "selectsession"
    name: "selectsession"
    args:
      #session_indexs: [8,10,16,17,27,28,29,30,0,1,2,3,4,5,6,7]
      session_indexs: [8, 12, 16, 17, 29, 30, 1, 2, 3, 4, 5, 6, 7, 0]
  - id: "zscore_norm"
    name: "zscore"
    args: {dim: -1}

features:
  - id: "complexity_temmporal_target"
    name: "TrialTrend"
    dataset: "novelty"
    preprocessors: ["selectsession","zscore_norm"]
    args:
      feature_name: "Complexity_base"
      window_index: [200,600]
      feature_args:
        complexity_type: "LZC"
        arguments:
          num_levels: 2
      channels: [2]
  - id: "dpli_trend"
    name: "TrialTrendPaired"
    dataset: "novelty"
    preprocessors: ["selectsession","zscore_norm"]
    args:
      feature_name: "DPLI_base"
      window_index: [200,600]
      feature_args:
        sfreq: 2000
        x_lowcut: 5
        x_highcut: 10
        y_lowcut: 5
        y_highcut: 10
      channelpairs: [[2,0]]

visualizers:
  - name: "trial_dynamic_feature_visualizer"
    args: 
      FeatureName: "DPLI"
      legends: ["Straitum-mPFC"]
      same_figure: false
      movemeansize: 20
      edge_mode: "same" # Another mode is "trim"
      title: "move_mean with the same size 20(with ASR)"
    inputs:
      - feature: "complexity_temmporal_target"
      - feature: "dpli_trend"
features:
  - id: "multi_feature_example"
    name: "FeaturePipeline"
    dataset: "novelty"
    preprocessors: ["selectsession","selecttime","zscore_norm"]
    args:
      return_mode: "last"
      steps:
          - id: "complexity_temmporal_target"
            name: "TrialTrend"
            args:
              feature_name: "Complexity_base"
              window_index: [1340,1740]
              feature_args:
                complexity_type: "SampEn"
                arguments: 
                        m: 2
                        r: 0.15
                        tau: 1
              channels: [2]
          - id: "normalization"
            name: "normalize"
            args:
               axis: -1

visualizers:
  - name: "trial_dynamic_feature_visualizer"
    args: 
      FeatureName: "Complexity"
      movemeansize: 10
      edge_mode: "same" # Another mode is "trim"
      title: "Complexity Trend Normalized"
      legends: ["Striatum"]
    inputs:
      - feature: "multi_feature_example"

visualizers:
  - name: "composite_visualizer"
    args:
      title: "TE Overview"
      share_figure: true
      tight_layout: true
      layout:
        rows: 2
        cols: 3
      figsize: [14, 10]
    children:
      - name: "time_dynamic_feature_visualizer"
        args: 
          FeatureName: "te_HC_Striatum"
          legends: ["HC"]
          xrange: [-0.2,1]
          scheme: "same_figure"
        inputs:
          - feature: "te_temmporal_target_HC_Striatum"
          - feature: "te_temmporal_standard_HC_Striatum"
      
      - name: "time_dynamic_feature_visualizer"
        args: 
          FeatureName: "te_HC_Striatum"
          legends: ["HC"]
          xrange: [-0.2,1]
          scheme: "same_figure"
        inputs:
          - feature: "te_temmporal_target_Striatum_HC"
          - feature: "te_temmporal_standard_Striatum_HC"
      
      - name: "time_dynamic_feature_visualizer"
        args: 
          FeatureName: "te_HC_mPFC"
          legends: ["STR"]
          xrange: [-0.2,1]
          scheme: "same_figure"
        inputs:
          - feature: "te_temmporal_target_HC_mPFC"
          - feature: "te_temmporal_standard_HC_mPFC"
      
      - name: "time_dynamic_feature_visualizer"
        args: 
          FeatureName: "te_HC_mPFC"
          legends: ["STR"]
          xrange: [-0.2,1]
          scheme: "same_figure"
        inputs:
          - feature: "te_temmporal_target_mPFC_HC"
          - feature: "te_temmporal_standard_mPFC_HC"
      
      - name: "time_dynamic_feature_visualizer"
        args: 
          FeatureName: "te_STR_mPFC"
          legends: ["mPFC"]
          xrange: [-0.2,1]
          scheme: "same_figure"
        inputs:
          - feature: "te_temmporal_target_Striatum_mPFC"
          - feature: "te_temmporal_standard_Striatum_mPFC"

      - name: "time_dynamic_feature_visualizer"
        args: 
          FeatureName: "te_STR_mPFC"
          legends: ["mPFC"]
          xrange: [-0.2,1]
          scheme: "same_figure"
        inputs:
          - feature: "te_temmporal_target_mPFC_Striatum"
          - feature: "te_temmporal_standard_mPFC_Striatum"

datasets:
  - id: "novelty"
    format: "mat_events"
    path: "/media/mohammad/atp/D/ComplexityCheckCodes/RawData/PiplineCodes/EpochedData/Fix_Ch_Order_PreConfig_1_epoched_preprocessed_novelty0-raw_dataV3.mat"
  - id: "complexity_rest"
    format: "mat_cell"
    path: "/media/mohammad/atp/D/ComplexityCheckCodes/RawData/PiplineCodes/Complexity/complexitySampeEnStandardizeChBaselineSessions.mat"


preprocessors:
  - id: "selectsession"
    name: "selectsession"
    args:
      session_indexs: [8, 12, 16, 17, 29, 30, 1, 2, 3, 4, 5, 6, 7, 0]
  - id: "zscore_norm"
    name: "zscore"
    args: {dim: -1}
  - id: "time_selection"
    name: "selecttime"
    args:
      start_index: 540
      end_index: 3340 # up to 1 second

features:
  - id: "te_temmporal_target_HC_Striatum"
    name: "EventWindowedPairFeature"
    dataset: "novelty"
    preprocessors: ["selectsession","time_selection","zscore_norm"]
    args:
      feature_name: "TE_base"
      window_size: 400
      event_type: 2
      channel_pairs: [[0,2]]
      paradigm: "per_epoch"
      overlap: 0.5
      feature_args:
        d_x: 1
        d_y: 1
        w_x: 15
        w_y: 15
  - id: "te_temmporal_target_HC_mPFC"
